# Automatically build both the Fabric mod and the Velocity plugin for every push
# and submitted pull request.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: build fabric mod
        working-directory: fabric
        run: |
          chmod +x ./gradlew
          ./gradlew build
      - name: build velocity plugin
        working-directory: velocity
        run: |
          chmod +x ./gradlew
          ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: |
            fabric/build/libs/
            velocity/build/libs/
